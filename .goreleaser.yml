version: 2
project_name: career

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: career
    ldflags:
      - -s -w -X github.com/nao1215/career/cmd.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux system packages for apt/dnf/apk users (the same set gup, sqly and atago
# ship), so career can be installed without a Go toolchain.
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: "Renders Japanese 履歴書 and 職務経歴書 and English CV PDFs from one YAML file"
    homepage: https://github.com/nao1215/career
    license: MIT License
    formats:
      - deb
      - rpm
      - apk

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
