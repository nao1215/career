name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the language floor (the oldest Go that builds career
          # unchanged), not the toolchain this job should use. Building the
          # binary and the E2E run should exercise the current release so the
          # artifacts users download carry the latest runtime and security
          # fixes; unit_test.yml is where the floor itself is verified.
          go-version: "stable"

      - name: Build
        run: make build
