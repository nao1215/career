name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (linux)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the language floor (the oldest Go that builds career
          # unchanged), not the toolchain this job should use. Building the
          # binary and the E2E run should exercise the current release so the
          # artifacts users download carry the latest runtime and security
          # fixes; unit_test.yml is where the floor itself is verified.
          go-version: "stable"

      # career's E2E specs run through atago; `make coverage` builds a
      # coverage-instrumented career and runs the atago suite so the E2E
      # covdata can be merged with unit coverage.
      - name: Install atago
        uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.0

      # Combines unit-test coverage with self-hosted E2E coverage (E2E runs a
      # `go build -cover` career and collects covdata via GOCOVERDIR), then
      # merges both into coverage.out.
      - name: Run combined unit + E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
