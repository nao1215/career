name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    # The two ends of the supported range. go.mod declares 1.22 because that is
    # the oldest Go the code compiles and passes on unchanged -- running it here
    # is what keeps a newer-only construct from silently raising the floor. The
    # newest release is the other leg: it catches behaviour changes and new vet
    # checks before users hit them.
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        # The floor go.mod declares and the newest release. "stable" rather
        # than a pinned newest version, so the ceiling keeps tracking Go
        # releases without an edit -- a pinned "1.27" is correct only until
        # 1.28 ships -- and rather than "1", because setup-go resolves "1"
        # from its own manifest, which lags a fresh release.
        go:
          - "1.23"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit tests
        run: go test -v ./...
