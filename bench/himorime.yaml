# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# career measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Resume files are generated by gen.sh before measuring. Both revisions run
# the working tree's gen.sh (${head_root}), so they read the same bytes.
#
# The size in a benchmark name is the number of employers in the resume:
# 3, a typical resume where start-up and loading the embedded fonts dominate,
# and 300, which runs to 151 pages of cv so laying out text dominates.
version: "1"

name: career
description: Start-up, and rendering the cv, japanese-resume and work-history PDFs from resumes of 3 and 300 employers.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..
  # The Makefile builds with cgo disabled, as the released binaries are.
  env:
    CGO_ENABLED: "0"

defaults:
  warmup: 2
  runs: 20
  # career reads no configuration, but keep HOME inside the benchmark's own
  # directory so nothing of the developer's environment can leak in.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting career and exiting.
    tags: [smoke]
    commands:
      career:
        command: ["${artifact}", version]

  - name: generate 3 employers
    description: >-
      A resume of three employers rendered with each template, the 履歴書
      with the sample portrait, and all three at once with --template all.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", resume, "3", "${workdir}/resume.yaml"]
    # --template all writes each PDF under its default name into the
    # working directory.
    cwd: "${workdir}"
    baseline: cv
    commands:
      cv:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, cv, --output, "${workdir}/cv.pdf"]
      japanese-resume:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, japanese-resume, --output, "${workdir}/japanese-resume.pdf"]
      japanese-resume-photo:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, japanese-resume, --photo, "${head_root}/../image/sample_japanese_man.jpg", --output, "${workdir}/photo.pdf"]
      work-history:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, work-history, --output, "${workdir}/work-history.pdf"]
      all:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, all]

  - name: generate 300 employers
    description: >-
      A resume of 300 employers of three projects each rendered with each
      template: the cv and the 職務経歴書 run to 151 pages, the 履歴書 to 21
      for its 600 join and leave lines.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", resume, "300", "${workdir}/resume.yaml"]
    cwd: "${workdir}"
    baseline: cv
    metrics:
      throughput:
        work: {value: 300, unit: employers}
    commands:
      cv:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, cv, --output, "${workdir}/cv.pdf"]
      japanese-resume:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, japanese-resume, --output, "${workdir}/japanese-resume.pdf"]
      work-history:
        command: ["${artifact}", generate, "${workdir}/resume.yaml", --template, work-history, --output, "${workdir}/work-history.pdf"]

  - name: generate error
    description: A resume file that does not exist, which fails with exit 1.
    tags: [smoke]
    exit_codes: [1]
    commands:
      career:
        command: ["${artifact}", generate, "${workdir}/missing.yaml", --output, "${workdir}/cv.pdf"]
